<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
<style>text{font-family:Arial,sans-serif;fill:#172033}.box{fill:#f8fbff;stroke:#2563eb;stroke-width:2}.head{fill:#2563eb}.h{fill:white;font-weight:bold}.a{font-size:16px}.t{font-size:18px;font-weight:bold}.line{stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<rect width="1600" height="950" fill="#fff"/>
<text x="40" y="42" class="t">Spotify Music Streaming — ER diagram</text>
<g transform="translate(45 90)"><rect class="box" width="260" height="170" rx="8"/><rect class="head" width="260" height="34" rx="8"/><text x="15" y="23" class="h">artists</text><text x="15" y="60" class="a">PK artist_id</text><text x="15" y="84" class="a">artist_name, country_code, genre</text><text x="15" y="108" class="a">is_verified, monthly_listeners</text><text x="15" y="132" class="a">created_at</text></g>
<g transform="translate(390 70)"><rect class="box" width="285" height="185" rx="8"/><rect class="head" width="285" height="34" rx="8"/><text x="15" y="23" class="h">albums</text><text x="15" y="60" class="a">PK album_id · FK artist_id</text><text x="15" y="84" class="a">title, type, release_date</text><text x="15" y="108" class="a">label, UQ upc</text></g>
<g transform="translate(760 70)"><rect class="box" width="300" height="190" rx="8"/><rect class="head" width="300" height="34" rx="8"/><text x="15" y="23" class="h">tracks</text><text x="15" y="60" class="a">PK track_id · FK album_id</text><text x="15" y="84" class="a">disc_no, track_no, title</text><text x="15" y="108" class="a">duration_ms, explicit, UQ isrc</text><text x="15" y="132" class="a">popularity</text></g>
<g transform="translate(1145 70)"><rect class="box" width="300" height="155" rx="8"/><rect class="head" width="300" height="34" rx="8"/><text x="15" y="23" class="h">track_artists</text><text x="15" y="60" class="a">PK/FK track_id</text><text x="15" y="84" class="a">PK/FK artist_id</text><text x="15" y="108" class="a">role (PRIMARY/FEATURED)</text></g>
<g transform="translate(45 410)"><rect class="box" width="285" height="180" rx="8"/><rect class="head" width="285" height="34" rx="8"/><text x="15" y="23" class="h">users</text><text x="15" y="60" class="a">PK user_id · UQ email</text><text x="15" y="84" class="a">display_name, country_code</text><text x="15" y="108" class="a">birth_date, subscription</text><text x="15" y="132" class="a">created_at</text></g>
<g transform="translate(410 410)"><rect class="box" width="310" height="155" rx="8"/><rect class="head" width="310" height="34" rx="8"/><text x="15" y="23" class="h">playlists</text><text x="15" y="60" class="a">PK playlist_id · FK owner_user_id</text><text x="15" y="84" class="a">name, is_public, is_collaborative</text><text x="15" y="108" class="a">created_at</text></g>
<g transform="translate(815 395)"><rect class="box" width="340" height="175" rx="8"/><rect class="head" width="340" height="34" rx="8"/><text x="15" y="23" class="h">playlist_tracks</text><text x="15" y="60" class="a">PK/FK playlist_id + position</text><text x="15" y="84" class="a">FK track_id, added_by_user_id</text><text x="15" y="108" class="a">added_at</text></g>
<g transform="translate(1210 390)"><rect class="box" width="335" height="215" rx="8"/><rect class="head" width="335" height="34" rx="8"/><text x="15" y="23" class="h">streams</text><text x="15" y="60" class="a">PK stream_id · FK user_id, track_id</text><text x="15" y="84" class="a">started_at, ms_played, platform</text><text x="15" y="108" class="a">source_type, FK playlist_id?</text><text x="15" y="132" class="a">skipped, offline</text></g>
<g transform="translate(260 720)"><rect class="box" width="310" height="120" rx="8"/><rect class="head" width="310" height="34" rx="8"/><text x="15" y="23" class="h">liked_tracks</text><text x="15" y="60" class="a">PK/FK user_id + track_id</text><text x="15" y="84" class="a">liked_at</text></g>
<g transform="translate(780 720)"><rect class="box" width="310" height="120" rx="8"/><rect class="head" width="310" height="34" rx="8"/><text x="15" y="23" class="h">artist_follows</text><text x="15" y="60" class="a">PK/FK user_id + artist_id</text><text x="15" y="84" class="a">followed_at</text></g>
<path class="line" d="M305 175 L390 165"/><path class="line" d="M675 165 L760 165"/><path class="line" d="M1060 160 L1145 150"/><path class="line" d="M330 485 L410 485"/><path class="line" d="M720 490 L815 490"/><path class="line" d="M1060 255 L1210 400"/><path class="line" d="M1155 490 L1210 490"/><path class="line" d="M330 540 L1210 535"/><path class="line" d="M330 590 L350 720"/><path class="line" d="M570 760 L760 200"/><path class="line" d="M570 780 L780 780"/><path class="line" d="M1090 780 L1145 190"/>
<text x="45" y="900" class="a">Cardinalities: artist 1:N album; album 1:N track; track M:N artist; user 1:N playlist/stream; playlist M:N track; user M:N track (likes) and artist (follows).</text>
</svg>
